name: release-cli
on:
  push:
    tags:
      - 'cli/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#cli/}" >> $GITHUB_OUTPUT
      - name: validate version
        run: ./scripts/validate-version.sh "${{ github.ref_name }}"
      - name: validate changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ./scripts/validate-changelog.sh "${VERSION#v}"

  build-binaries:
    needs: quality-gates
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: build binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: upload binary
        uses: actions/upload-artifact@v5
        with:
          name: qtcloud-connect-${{ matrix.target }}
          path: ${{ github.workspace }}/src/cli/target/${{ matrix.target }}/release/qtcloud-connect${{ matrix.ext }}

  upload-release-assets:
    needs: [check, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: qtcloud-connect-*
          path: release-assets
      - name: normalize asset names
        run: |
          mv release-assets/qtcloud-connect-x86_64-unknown-linux-gnu/qtcloud-connect release-assets/qtcloud-connect-linux-x86_64
          mv release-assets/qtcloud-connect-aarch64-apple-darwin/qtcloud-connect release-assets/qtcloud-connect-macos-arm64
          mv release-assets/qtcloud-connect-x86_64-pc-windows-msvc/qtcloud-connect.exe release-assets/qtcloud-connect-windows-x86_64.exe
          chmod +x release-assets/qtcloud-connect-linux-x86_64 release-assets/qtcloud-connect-macos-arm64
      - name: mark prerelease when applicable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#cli/}"
          if [[ "$VERSION" == *-alpha.* || "$VERSION" == *-beta.* || "$VERSION" == *-rc.* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag
          fi
      - name: upload release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  quality-gates:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --check
      - name: test
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --locked -- -A warnings
      - name: publish dry run
        run: cargo publish --dry-run --locked --registry crates-io

  publish-crate:
    needs: [quality-gates, upload-release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: publish to crates.io
        working-directory: src/cli
        run: cargo publish --locked --registry crates-io --token ${{ secrets.CRATES_API_TOKEN }}
