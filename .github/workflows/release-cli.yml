name: release-cli
on:
  push:
    tags:
      - 'cli/*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#cli/}" >> $GITHUB_OUTPUT
      - name: validate version
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/validate-version.sh "${{ github.ref_name }}" "
      - name: validate changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          # CHANGELOG 在仓库根目录（src/cli/../../CHANGELOG.md）
          ./scripts/validate-changelog.sh "${VERSION#v}" ../../CHANGELOG.md
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          -D warnings: false
      - name: run tests
        run: cargo test

  build-binaries:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: build binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: upload binary
        uses: actions/upload-artifact@v5
        with:
          name: qtcloud-connect-${{ matrix.target }}
          path: ${{ github.workspace }}/src/cli/target/${{ matrix.target }}/release/qtcloud-connect${{ matrix.ext }}
