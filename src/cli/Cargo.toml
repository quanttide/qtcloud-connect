[package]
name = "qtcloud-connect-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qtcloud-connect"
path = "src/main.rs"

[lib]
name = "qtcloud_connect_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quanttide-agent = "0.1.0"
