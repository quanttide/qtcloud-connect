[project]
name = "cli"
version = "0.1.0"
description = "qtcloud-connect CLI — provider API 客户端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.25.1",
]

[project.scripts]
qtcloud-connect = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9",
    "pytest-cov>=7",
]
